version: '3.8'

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gridsync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gridsync
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend-1:
    build: backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gridsync
      - SPRING_DATASOURCE_USERNAME=gridsync
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/gridsync
      - SPRING_FLYWAY_USER=gridsync
      - SPRING_FLYWAY_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=5523916298517227441584347712399990526019313264421295286591038481
      - SERVER_PORT=8080
    depends_on:
      - postgres
      - redis

  backend-2:
    build: backend
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gridsync
      - SPRING_DATASOURCE_USERNAME=gridsync
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/gridsync
      - SPRING_FLYWAY_USER=gridsync
      - SPRING_FLYWAY_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=5523916298517227441584347712399990526019313264421295286591038481
      - SERVER_PORT=8080
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2

volumes:
  postgres_data:
  redis_data:
